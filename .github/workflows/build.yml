name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q KeyButtons (1).zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: KeyButtons
      - uses: actions/upload-artifact@v4
        with:
          name: KeyButtons-debug-apk
          path: KeyButtons/app/build/outputs/apk/debug/app-debug.apk
