name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать и найти проект
        run: |
          echo "--- файлы в корне ---"; ls -la
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z"
          done
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts НЕ НАЙДЕН"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          echo "ROOT=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Проект: $(dirname "$F")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > "$ROOT/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Сборка
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KeyButtons-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
